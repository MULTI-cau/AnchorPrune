[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorprune"
version = "1.0.0"
description = "AnchorPrune: relevance-anchored contextual expansion for visual token pruning in VLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Model-independent LMMs-Eval runtime.
    "numpy==1.26.4",
    "sentencepiece==0.1.99",
    "einops==0.6.1",
    "requests>=2.31.0",
    "httpx==0.24.0",

    # Minimal LMMs-Eval runtime dependencies used by the paper image benchmarks.
    "datasets==5.0.0",
    "evaluate==0.4.6",
    "jsonlines==4.0.0",
    "aiohttp==3.14.1",
    "numexpr==2.14.1",
    "pybind11==3.0.4",
    "pytablewriter==1.2.1",
    "sacrebleu==2.6.0",
    "scikit-learn==1.2.2",
    "ftfy==6.3.1",
    "opencv-python-headless==4.10.0.84",
    "av==15.1.0",
    "hf_transfer==0.1.9",
    "nltk==3.9.4",
    "yt-dlp==2026.6.9",
    "pycocoevalcap==1.2",
    "tqdm-multiprocess==0.0.11",
    "transformers-stream-generator==0.0.5",
    "zstandard==0.25.0",
    "pillow==10.4.0",
    "pyyaml==6.0.3",
    "sympy==1.13.1",
    "latex2sympy2==1.9.1",
    "mpmath==1.3.0",
    "Jinja2==3.1.6",
    "openpyxl==3.1.5",
    "loguru==0.7.3",
    "tenacity==9.1.4",
    "pydantic==2.13.4",
    "packaging>=23.0",
    "zss==1.2.0",
    "protobuf==6.33.6",
    "python-dotenv==1.2.2",
    "math-verify==0.1.0",
]

[project.optional-dependencies]
llava = [
    "numpy==1.26.4",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "timm==0.6.13",
    "accelerate==0.21.0",
    "einops-exts==0.0.4",
    "shortuuid>=1.0.11",
]
qwen = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.4.0",
    "accelerate==1.13.0",
    "timm==1.0.26",
    "qwen-vl-utils==0.0.14",
    "decord==0.6.0",
]
dev = [
    "black>=24.1.0",
    "isort>=5.13.2",
]

[tool.setuptools.package-data]
"lmms_eval" = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]

[tool.setuptools.packages.find]
where = [".", "lmms-eval"]
include = ["anchorprune*", "lmms_eval*", "llava*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs*",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
    "logs*",
]
